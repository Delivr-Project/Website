# .gitlab-ci.yml — root include for LeiCraftMC projects.
# Copy to project root and add per-project stages or extra includes as needed.
# Uses oven/bun everywhere; expects .gitlab/ci/testing.yml and .gitlab/ci/build.yml.

stages:
  - test
  - build_and_deploy

variables:
  GIT_DEPTH: "20"
  BUN_INSTALL_CACHE: "$CI_PROJECT_DIR/.bun"

include:
  - local: ".gitlab/ci/testing.yml"
  - local: ".gitlab/ci/build.yml"
