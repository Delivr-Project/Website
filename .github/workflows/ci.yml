# CI workflow for GitHub-hosted LeiCraftMC projects.
# Runs biome, typecheck, and tests on every push/PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx biome check
      - run: bun run typecheck
      - run: bun test
